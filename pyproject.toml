[project]
name = "rag-address"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.3.0",
    "datasets>=3.2.0",
    "faiss-cpu>=1.10.0",
    "langchain>=0.3.18",
    "langchain-community>=0.3.16",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pacmap>=0.7.6",
    "plotly>=6.0.0",
    "ragatouille>=0.0.8.post4",
    "requests>=2.32.3",
    "ruff>=0.9.4",
    "sentence-transformers>=2.7.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.48.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true
# skip-magic-trailing-comma = true

[tool.ruff.lint]
# Adds isort linting
extend-select = ["I"]
# Ignore bothersome warnings:
# E402: module level import not at top of file
# E712: comparison to False (its bothersome for pandas column comparison to boolean)
extend-ignore = ["E402", "E712"]
# Don't autoremove unused imports, variable, etc.
unfixable = ["F401"]
# A file or directory to exclude from linting
exclude = ["scratchpad.py"]

[tool.ruff.lint.pydocstyle]
# Or "numpy" for example
convention = "google"
